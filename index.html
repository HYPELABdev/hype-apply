<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hype Apply</title>
<meta name="theme-color" content="#00ff88">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon/icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;
background:#060a08 url('./icon/bg.png') center/cover no-repeat;
font-family:'Space Grotesk',system-ui;color:#e9f2ed}
.card{width:min(92vw,380px);padding:32px 28px;border-radius:28px;
background:rgba(10,14,12,.72);backdrop-filter:blur(18px);
border:1px solid rgba(16,217,143,.18);text-align:center}
.logo{width:96px;height:96px;margin:0 auto 18px;border-radius:24px;
background:#10d98f url('./icon/icon.png') center/68% no-repeat}
h1{font-size:32px;line-height:1;letter-spacing:-.02em}
h1 span{color:#10d98f}
p{margin:10px 0 22px;color:#93a89b;font-size:14px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;
width:100%;border-radius:16px;background:#10d98f;color:#06281c;
font-weight:700;font-size:18px;text-decoration:none}
.sub{margin-top:14px;font-size:12px;color:#6b7f75}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>Hype <span>Apply</span></h1>
    <p>Envie seu currículo por e-mail ou WhatsApp.<br>100% do seu Gmail. Instalável.</p>
    <a class="btn" href="./app.html">Abrir App</a>
    <div class="sub">PWA • Funciona offline • v1 real</div>
  </div>
</body>
</html>
